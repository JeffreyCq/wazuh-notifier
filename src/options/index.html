<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wazuh Notifier — Settings</title>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="logo">⛨</span>
        <div>
          <h1>Wazuh Notifier</h1>
          <p class="subtitle">Settings</p>
        </div>
      </header>

      <main>
        <!-- Clusters -->
        <section class="card">
          <div class="card-header">
            <h2>Clusters</h2>
            <button id="btn-add-cluster" class="btn btn-primary btn-sm">+ Add Cluster</button>
          </div>
          <div id="cluster-list" class="cluster-list">
            <p class="empty-hint">No clusters yet. Add one to get started.</p>
          </div>
        </section>

        <!-- Notifications -->
        <section class="card">
          <h2>Notifications</h2>
          <div class="toggle-row">
            <div>
              <p class="toggle-label">Sound alerts</p>
              <p class="toggle-desc">Play a beep when new critical alerts are detected</p>
            </div>
            <label class="switch">
              <input type="checkbox" id="sound-enabled" />
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <!-- Data -->
        <section class="card">
          <h2>Data</h2>
          <div class="data-actions">
            <button id="btn-export-json" class="btn btn-secondary btn-sm">Export JSON</button>
            <button id="btn-export-csv" class="btn btn-secondary btn-sm">Export CSV</button>
            <button id="btn-clear-history" class="btn btn-danger btn-sm">Clear History</button>
          </div>
        </section>

        <div class="save-row">
          <button id="btn-save" class="btn btn-primary">Save Settings</button>
          <span id="save-status" class="save-status"></span>
        </div>
      </main>
    </div>

    <!-- Cluster edit modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Add Cluster</h3>
          <button id="modal-close" class="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="c-name">Cluster Name</label>
            <input type="text" id="c-name" placeholder="Production Wazuh" />
          </div>

          <div class="field" style="margin-top:14px">
            <label>Connection Mode</label>
            <div class="mode-tabs">
              <button class="mode-tab active" data-mode="selfhosted">🖥 Self-hosted</button>
              <button class="mode-tab" data-mode="cloud">☁ Wazuh Cloud</button>
            </div>
          </div>

          <div id="m-selfhosted">
            <div class="field">
              <label for="c-opensearch-url">OpenSearch URL</label>
              <input type="url" id="c-opensearch-url" placeholder="https://192.168.1.100:9200" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="c-username">Username</label>
                <input type="text" id="c-username" placeholder="admin" autocomplete="off" />
              </div>
              <div class="field">
                <label for="c-password">Password</label>
                <div class="field-input-row">
                  <input type="password" id="c-password" placeholder="••••••••" autocomplete="new-password" />
                  <button type="button" id="c-toggle-password" class="btn-inline">Show</button>
                </div>
              </div>
            </div>
          </div>

          <div id="m-cloud" class="hidden">
            <div class="field">
              <label for="c-dashboard-url">Dashboard URL</label>
              <input type="url" id="c-dashboard-url" placeholder="https://xxxxxxxx.cloud.wazuh.com" />
            </div>
            <div class="cloud-hint">
              <span>ℹ</span> Uses your active browser session — log into the dashboard first.
            </div>
          </div>

          <div class="field-row" style="margin-top:14px">
            <div class="field">
              <label for="c-poll-interval">Poll Interval</label>
              <div class="field-input-row narrow">
                <input type="number" id="c-poll-interval" min="1" max="60" value="2" />
                <span class="input-suffix">min</span>
              </div>
            </div>
            <div class="field">
              <label for="c-min-level">Min Alert Level</label>
              <div class="field-input-row">
                <input type="range" id="c-min-level" min="1" max="15" value="12" />
                <span id="c-level-value" class="level-badge">12</span>
              </div>
            </div>
          </div>

          <div class="field" style="margin-top:14px">
            <label for="c-agent-filter">Agent Filter <span class="optional">(optional)</span></label>
            <input type="text" id="c-agent-filter" placeholder="e.g. web-server (partial match)" />
          </div>

          <div class="test-row">
            <button id="c-btn-test" class="btn btn-secondary btn-sm">Test Connection</button>
            <span id="c-test-result" class="test-result"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-save" class="btn btn-primary">Save Cluster</button>
        </div>
      </div>
    </div>
  </body>
</html>
